services:
  agent-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SUPPLYCHAIN_AGENT_POSTGRES_DB:-supplychain_agent}
      POSTGRES_USER: ${SUPPLYCHAIN_AGENT_POSTGRES_USER:-supplychain_agent}
      POSTGRES_PASSWORD: ${SUPPLYCHAIN_AGENT_POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${SUPPLYCHAIN_AGENT_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - agent-postgres-data:/var/lib/postgresql/data

volumes:
  agent-postgres-data:
